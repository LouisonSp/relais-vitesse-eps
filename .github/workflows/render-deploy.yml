name: Deploy to Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  notify:
    name: Notify Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Render Deploy Hook
        if: github.event_name == 'push'
        run: |
          echo "Push détecté sur ${{ github.ref }}. Render déploiera automatiquement si connecté."
          echo "Pour activer le déploiement automatique :"
          echo "1. Allez sur Render Dashboard"
          echo "2. Configurez votre service avec Auto-Deploy activé"
